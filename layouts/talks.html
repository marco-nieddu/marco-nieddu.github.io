{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
{{ with .Content }}<div class="prose page-intro">{{ . }}</div>{{ end }}
{{ range hugo.Data.talks }}{{ if .items }}
<section class="talks">
  <h2>{{ .heading }}</h2>
  <ul class="dated">
    {{ range .items }}<li><span class="when">{{ .date }}</span><span>{{ .text | markdownify }}</span></li>{{ end }}
  </ul>
</section>
{{ end }}{{ end }}
{{ end }}
