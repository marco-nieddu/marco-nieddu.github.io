{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
{{ with .Content }}<div class="prose page-intro">{{ . }}</div>{{ end }}
{{ with hugo.Data.talks }}
<ul class="dated talks">
  {{ range . }}<li><span class="when">{{ .date }}</span><span>{{ .text | markdownify }}</span></li>{{ end }}
</ul>
{{ end }}
{{ end }}
